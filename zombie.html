<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  body,html{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;font-family:system-ui,-apple-system,sans-serif;color:#fff}
  #game-container{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1}
  #hud{position:absolute;top:0;left:0;right:0;padding:15px;pointer-events:none;z-index:10;display:flex;flex-direction:column;gap:8px;padding-top:max(15px, env(safe-area-inset-top))}
  .bar{height:16px;background:rgba(0,0,0,.7);border:2px solid rgba(255,255,255,.8);border-radius:8px;overflow:hidden;box-shadow:0 0 15px rgba(0,0,0,.8)}
  #hpfill{height:100%;width:100%;background:linear-gradient(90deg,#c0392b,#e74c3c,#ff8a65);transition:width .2s}
  #xpfill{height:100%;width:0%;background:linear-gradient(90deg,#2980b9,#3498db,#00e5ff);transition:width .3s}
  .top-row{display:flex;justify-content:space-between;font-weight:900;font-size:16px;text-shadow:0 2px 5px #000;padding:0 5px;letter-spacing:1px}
  
  #rotateBtn{position:absolute;top:max(15px, env(safe-area-inset-top));right:15px;z-index:20;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.4);color:#fff;padding:10px 14px;border-radius:12px;font-size:20px;backdrop-filter:blur(5px);transition:all .2s}
  #rotateBtn:active{background:rgba(255,255,255,.4);transform:scale(.95)}
  
  #joystick{position:absolute;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.2);z-index:10;pointer-events:none;display:none;box-shadow:inset 0 0 20px rgba(0,0,0,.5)}
  #jstick{position:absolute;width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.7);top:35px;left:35px;box-shadow:0 0 15px rgba(255,255,255,.5)}
  
  #fireBtn{position:absolute;bottom:max(30px, env(safe-area-inset-bottom));right:25px;width:100px;height:100px;border-radius:50%;background:radial-gradient(circle at 30% 30%, #ff4757, #c0392b);border:4px solid #fff;color:#fff;font-weight:900;font-size:20px;z-index:15;box-shadow:0 0 25px rgba(255,71,87,.8);display:flex;justify-content:center;align-items:center;text-shadow:0 2px 4px rgba(0,0,0,.5)}
  #fireBtn:active{transform:scale(.92);background:radial-gradient(circle at 30% 30%, #ff6b81, #e74c3c)}
  
  #upgrades{position:absolute;inset:0;background:rgba(10,5,20,.9);backdrop-filter:blur(8px);z-index:100;display:none;flex-direction:column;justify-content:center;align-items:center;padding:20px}
  .card{background:linear-gradient(145deg,#1a1a2e,#16213e);border:2px solid #0f3460;border-radius:16px;padding:22px;margin:10px;width:100%;max-width:340px;cursor:pointer;text-align:center;transition:transform .15s;box-shadow:0 10px 30px rgba(0,0,0,.6)}
  .card:active{transform:scale(.95);border-color:#e94560}
  .card h3{margin:0 0 10px;color:#e94560;font-size:22px;text-shadow:0 0 10px rgba(233,69,96,.4)}
  .card p{margin:0;font-size:15px;color:#a0a0b0;line-height:1.4}
  
  #gameover{position:absolute;inset:0;background:rgba(20,0,0,.95);z-index:200;display:none;justify-content:center;align-items:center;flex-direction:column;text-align:center;padding:20px}
  #gameover h1{color:#ff3333;margin:0 0 20px;font-size:52px;text-shadow:0 0 30px #ff0000;letter-spacing:2px}
  #gameover div{font-size:20px;margin:10px;color:#ccc;font-weight:bold}
  button.restart{background:#e94560;color:#fff;border:none;padding:18px 40px;border-radius:15px;font-size:20px;margin-top:40px;font-weight:900;box-shadow:0 6px 20px rgba(233,69,96,.5)}
  
  .dmg-text{position:absolute;color:#ffdd00;font-weight:900;font-size:24px;pointer-events:none;z-index:50;text-shadow:2px 2px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000;transition:transform 0.5s ease-out, opacity 0.5s ease-out}
</style>
</head><body>
<div id="game-container"></div>
<div id="hud">
  <div class="bar"><div id="hpfill"></div></div>
  <div class="bar" style="height:10px"><div id="xpfill"></div></div>
  <div class="top-row">
    <span id="level">УР. 1</span>
    <span id="kills">💀 0</span>
  </div>
</div>

<button id="rotateBtn" title="Поворот">🔄</button>
<div id="joystick"><div id="jstick"></div></div>
<button id="fireBtn">ОГОНЬ</button>
<div id="upgrades"></div>
<div id="gameover">
  <h1>ТЫ МЕРТВ</h1>
  <div>Уровень: <span id="goLevel" style="color:#fff">1</span></div>
  <div>Убито: <span id="goKills" style="color:#fff">0</span></div>
  <button class="restart" onclick="location.reload()">В БОЙ СНОВА</button>
</div>

<script type="importmap">

<script type="module">
import * as THREE from 'three';

// ---------- Инициализация ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05050a);
scene.fog = new THREE.FogExp2(0x05050a, 0.035);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 300);
camera.position.set(0, 1.7, 0);

const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference: "high-performance"});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('game-container').appendChild(renderer.domElement);// ---------- Освещение ----------
scene.add(new THREE.AmbientLight(0x334455, 1.2)); // Холодный ночной свет
const moonLight = new THREE.DirectionalLight(0x8899cc, 1.5);
moonLight.position.set(20, 30, 10);
moonLight.castShadow = true;
moonLight.shadow.mapSize.width = 1024;
moonLight.shadow.mapSize.height = 1024;
moonLight.shadow.camera.near = 0.5;
moonLight.shadow.camera.far = 100;
moonLight.shadow.camera.left = -50;
moonLight.shadow.camera.right = 50;
moonLight.shadow.camera.top = 50;
moonLight.shadow.camera.bottom = -50;
scene.add(moonLight);

const flashlight = new THREE.SpotLight(0xffffff, 8, 45, Math.PI/5, 0.6, 1);
flashlight.position.set(0, 1.7, 0);
flashlight.target.position.set(0, 0, -1);
camera.add(flashlight);
camera.add(flashlight.target);
scene.add(camera);

// ---------- Земля (Мертвая) ----------
const groundGeo = new THREE.PlaneGeometry(300, 300);
const groundMat = new THREE.MeshStandardMaterial({color: 0x1a1a1a, roughness: 0.9});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// ---------- Окружение (Надгробия и Деревья) ----------
const stoneMat = new THREE.MeshStandardMaterial({color: 0x444444, roughness: 0.8});
const woodMat = new THREE.MeshStandardMaterial({color: 0x2a1b15, roughness: 1.0});

for(let i=0; i<40; i++){
  // Надгробия
  if(Math.random() > 0.4) {
    const t = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.2, 0.2), stoneMat);
    t.position.set((Math.random()-0.5)*180, 0.6, (Math.random()-0.5)*180);
    t.rotation.y = Math.random() * Math.PI;
    t.castShadow = true; t.receiveShadow = true;
    scene.add(t);
  } else {
    // Кривые деревья
    const tree = new THREE.Group();
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.5, 4, 5), woodMat);
    trunk.position.y = 2; trunk.castShadow = true; tree.add(trunk);
    for(let j=0; j<3; j++){
      const branch = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.2, 2, 4), woodMat);
      branch.position.set((Math.random()-0.5)*2, 2+Math.random()*2, (Math.random()-0.5)*2);
      branch.rotation.set(Math.random(), Math.random(), Math.random());
      branch.castShadow = true; tree.add(branch);
    }
    tree.position.set((Math.random()-0.5)*180, 0, (Math.random()-0.5)*180);
    scene.add(tree);
  }
}// ---------- Игрок ----------
const player = {
  pos: new THREE.Vector3(0, 0, 0), yaw: 0,
  hp: 100, maxHp: 100, xp: 0, xpNext: 10, level: 1,
  damage: 25, fireRate: 400, speed: 5,
  lastShot: 0, kills: 0, alive: true, paused: false
};

// ---------- Зомби (Сложная модель) ----------
const zombies = [];
const fleshMat = new THREE.MeshStandardMaterial({color: 0x3e5c3e, roughness: 0.8});
const bloodMat = new THREE.MeshStandardMaterial({color: 0x4a1515, roughness: 0.6});
const clothMat = new THREE.MeshStandardMaterial({color: 0x2b2b3b, roughness: 0.9});
const eyeMat = new THREE.MeshBasicMaterial({color: 0xff0000});

function createZombieModel() {
  const group = new THREE.Group();

  // Торс
  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.0, 0.4), clothMat);
  torso.position.y = 1.3; torso.castShadow = true; group.add(torso);

  // Голова
  const headGroup = new THREE.Group();
  headGroup.position.set(0, 1.9, 0);
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), fleshMat);
  head.castShadow = true; headGroup.add(head);
  // Челюсть
  const jaw = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.15, 0.3), bloodMat);
  jaw.position.set(0, -0.25, 0.1); headGroup.add(jaw);
  // Глаза
  const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.06), eyeMat); eyeL.position.set(-0.12, 0.1, 0.26); headGroup.add(eyeL);
  const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.06), eyeMat); eyeR.position.set(0.12, 0.1, 0.26); headGroup.add(eyeR);
  group.add(headGroup);

  // Руки (с суставами)
  const armGeo = new THREE.BoxGeometry(0.25, 0.8, 0.25);
  const armL = new THREE.Group(); armL.position.set(-0.55, 1.7, 0);
  const meshArmL = new THREE.Mesh(armGeo, fleshMat); meshArmL.position.y = -0.4; meshArmL.castShadow = true; armL.add(meshArmL);
  group.add(armL);

  const armR = new THREE.Group(); armR.position.set(0.55, 1.7, 0);
  const meshArmR = new THREE.Mesh(armGeo, fleshMat); meshArmR.position.y = -0.4; meshArmR.castShadow = true; armR.add(meshArmR);
  group.add(armR);

  // Ноги (с суставами)
  const legGeo = new THREE.BoxGeometry(0.3, 0.9, 0.3);
  const legL = new THREE.Group(); legL.position.set(-0.2, 0.8, 0);
  const meshLegL = new THREE.Mesh(legGeo, clothMat); meshLegL.position.y = -0.45; meshLegL.castShadow = true; legL.add(meshLegL);
  group.add(legL);

  const legR = new THREE.Group(); legR.position.set(0.2, 0.8, 0);
  const meshLegR = new THREE.Mesh(legGeo, clothMat); meshLegR.position.y = -0.45; meshLegR.castShadow = true; legR.add(meshLegR);
  group.add(legR);

  return { group, parts: { armL, armR, legL, legR, headGroup } };
}

function spawnZombie(){
  const { group, parts } = createZombieModel();
  
  // Спавн подальше от игрока
  const angle = Math.random() * Math.PI * 2;
  const dist = 25 + Math.random() * 20;
  group.position.set(Math.cos(angle)*dist, 0, Math.sin(angle)*dist);

  group.userData = {
    hp: 25 + player.kills * 2,
    speed: 1.6 + Math.min(2.5, player.kills * 0.03) + Math.random()*0.5,
    lastHit: 0,
    parts: parts,
    walkPhase: Math.random() * Math.PI * 2 // Случайный старт анимации
  };
  scene.add(group);
  zombies.push(group);
}// ---------- Ввод ----------
const joystick = { active: false, id: null, startX: 0, startY: 0, dx: 0, dy: 0 };
const look = { active: false, id: null, lastX: 0, lastY: 0 };
const joyEl = document.getElementById('joystick');
const stickEl = document.getElementById('jstick');
const fireBtn = document.getElementById('fireBtn');

// --- ИСПРАВЛЕНИЕ ОРИЕНТАЦИИ И РАЗМЕРА ЭКРАНА ---
function resizeGame() {
  const w = window.visualViewport ? window.visualViewport.width : window.innerWidth;
  const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false); // false = не менять CSS-стили принудительно
  renderer.domElement.style.width = '100%';
  renderer.domElement.style.height = '100%';
}
window.addEventListener('resize', resizeGame);
window.addEventListener('orientationchange', () => setTimeout(resizeGame, 300));
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', resizeGame);
}
resizeGame(); // Вызов при старте

// Кнопка поворота
document.getElementById('rotateBtn').addEventListener('click', async () => {
  try {
    if (screen.orientation && screen.orientation.lock) {
      if (window.innerHeight > window.innerWidth) {
        await screen.orientation.lock('landscape');
      } else {
        await screen.orientation.lock('portrait');
      }
    } else {
      // Если WebView не поддерживает lock - принудительно меняем CSS (костыль для некоторых оберток)
      alert("Пожалуйста, поверните телефон вручную.");
    }
  } catch (e) { console.log("Ориентация заблокирована системой"); }
});

// --- Выстрел ---
fireBtn.addEventListener('touchstart', (e) => { e.preventDefault(); shoot(); }, {passive:false});
fireBtn.addEventListener('click', (e) => { e.preventDefault(); shoot(); });

// --- Тачскрин ---
renderer.domElement.addEventListener('touchstart', e => {
  e.preventDefault();
  for (const t of e.changedTouches){
    if (t.clientX < window.innerWidth/2 && !joystick.active){
      joystick.active = true; joystick.id = t.identifier;
      joystick.startX = t.clientX; joystick.startY = t.clientY;
      joyEl.style.display = 'block';
      joyEl.style.left = (t.clientX - 65) + 'px';
      joyEl.style.top  = (t.clientY - 65) + 'px';
      stickEl.style.left = '35px'; stickEl.style.top = '35px';
    } else if (t.clientX >= window.innerWidth/2 && !look.active){
      look.active = true; look.id = t.identifier;
      look.lastX = t.clientX; look.lastY = t.clientY;
    }
  }
}, {passive:false});

renderer.domElement.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches){
    if (joystick.active && t.identifier === joystick.id){
      let dx = t.clientX - joystick.startX;
      let dy = t.clientY - joystick.startY;
      const d = Math.hypot(dx, dy), max = 55;
      if (d > max){ dx = dx/d*max; dy = dy/d*max; }
      joystick.dx = dx / max; joystick.dy = dy / max;
      stickEl.style.left = (35 + dx) + 'px'; stickEl.style.top  = (35 + dy) + 'px';
    } else if (look.active && t.identifier === look.id){
      const dx = t.clientX - look.lastX;
      player.yaw -= dx * 0.005;
      look.lastX = t.clientX; look.lastY = t.clientY;
    }
  }
}, {passive:false});

renderer.domElement.addEventListener('touchend', e => {
  e.preventDefault();
  for (const t of e.changedTouches){
    if (joystick.active && t.identifier === joystick.id){
      joystick.active = false; joystick.dx = 0; joystick.dy = 0; joyEl.style.display = 'none';
    } else if (look.active && t.identifier === look.id){
      look.active = false;
    }
  }
}, {passive:false});

// ---------- Пули и Урон ----------
const bullets = [];
const bulletGeo = new THREE.CylinderGeometry(0.03, 0.03, 2, 5);
bulletGeo.rotateX(Math.PI/2);
const bulletMat = new THREE.MeshBasicMaterial({color: 0x00ffff});

function showDamageText(amount, pos) {
  const v = pos.clone().project(camera);
  if (v.z > 1) return;
  const x = (v.x * 0.5 + 0.5) * window.innerWidth;
  const y = (-v.y * 0.5 + 0.5) * window.innerHeight;
  const el = document.createElement('div');
  el.className = 'dmg-text';
  el.textContent = '-' + Math.round(amount);
  el.style.left = x + 'px'; el.style.top = y + 'px';
  document.body.appendChild(el);
  setTimeout(() => { el.style.transform = 'translateY(-60px) scale(1.5)'; el.style.opacity = '0'; }, 50);
  setTimeout(() => el.remove(), 600);
}

function shoot(){
  if (!player.alive || player.paused) return;
  const now = performance.now();
  if (now - player.lastShot < player.fireRate) return;
  player.lastShot = now;

  let target = null; let minDist = Infinity;
  for (const z of zombies) {
    const d = z.position.distanceTo(player.pos);
    if (d < minDist) { minDist = d; target = z; }
  }

  flashlight.intensity = 20; setTimeout(() => flashlight.intensity = 8, 50);

  if (!target) return;

  const fromPos = camera.position.clone();
  const toPos = target.position.clone().add(new THREE.Vector3(0, 1.2, 0));

  const b = new THREE.Mesh(bulletGeo, bulletMat);
  b.position.copy(fromPos); b.lookAt(toPos); scene.add(b);
  bullets.push({ mesh: b, target: toPos, speed: 120, life: 1 });

  target.userData.hp -= player.damage;
  target.userData.lastHit = now;
  showDamageText(player.damage, target.position.clone().add(new THREE.Vector3(0, 2, 0)));

  if (target.userData.hp <= 0) killZombie(target);
}function killZombie(z){
  const idx = zombies.indexOf(z);
  if (idx !== -1) zombies.splice(idx, 1);
  scene.remove(z);
  player.kills++;
  gainXp(4);
}

function gainXp(amount){
  player.xp += amount;
  let leveled = false;
  while (player.xp >= player.xpNext){
    player.xp -= player.xpNext; player.level++;
    player.xpNext = Math.floor(player.xpNext * 1.4); leveled = true;
  }
  if (leveled) showUpgrades();
  updateHud();
}

const upgradePool = [
  {name:'Урон +50%', desc:'Пули наносят больше вреда', apply: () => player.damage *= 1.5},
  {name:'Скорострельность +30%', desc:'Стреляешь быстрее', apply: () => player.fireRate *= 0.7},
  {name:'Здоровье +40', desc:'Увеличивает макс. HP и лечит', apply: () => { player.maxHp += 40; player.hp = player.maxHp; }},
  {name:'Скорость +25%', desc:'Быстрее передвигаешься', apply: () => player.speed *= 1.25},
  {name:'Полное лечение', desc:'Восстанавливает всё HP', apply: () => player.hp = player.maxHp},
  {name:'Урон +100%', desc:'Двойной урон', apply: () => player.damage *= 2},
  {name:'Скорострельность +50%', desc:'Пулеметный темп', apply: () => player.fireRate *= 0.5},
  {name:'Скорость +50%', desc:'Реактивный бег', apply: () => player.speed *= 1.5},
];

function showUpgrades(){
  player.paused = true;
  const el = document.getElementById('upgrades');
  el.innerHTML = `<h2 style="margin:0 0 20px;color:#fff;font-size:32px;text-shadow:0 0 10px #3498db">УРОВЕНЬ ${player.level}!</h2>`;
  const pool = [...upgradePool]; const picks = [];
  for (let i = 0; i < 3; i++) picks.push(pool.splice(Math.floor(Math.random()*pool.length), 1)[0]);
  for (const up of picks){
    const c = document.createElement('div'); c.className = 'card';
    c.innerHTML = `<h3>${up.name}</h3><p>${up.desc}</p>`;
    c.addEventListener('click', () => { up.apply(); el.style.display = 'none'; player.paused = false; updateHud(); });
    el.appendChild(c);
  }
  el.style.display = 'flex';
}

function updateHud(){
  document.getElementById('hpfill').style.width = Math.max(0, player.hp / player.maxHp * 100) + '%';
  document.getElementById('xpfill').style.width = (player.xp / player.xpNext * 100) + '%';
  document.getElementById('level').textContent = 'УР. ' + player.level;
  document.getElementById('kills').textContent = '💀 ' + player.kills;
}

let damageCooldown = 0;
function damagePlayer(amount){
  if (!player.alive) return;
  player.hp -= amount;
  if (player.hp <= 0){
    player.hp = 0; player.alive = false;
    document.getElementById('goLevel').textContent = player.level;
    document.getElementById('goKills').textContent = player.kills;
    document.getElementById('gameover').style.display = 'flex';
  }
  updateHud();
}for (let i = 0; i < 10; i++) spawnZombie();
updateHud();

const clock = new THREE.Clock();
let spawnTimer = 0;

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const now = performance.now();

  if (!player.alive || player.paused){
    renderer.render(scene, camera);
    return;
  }

  // Движение игрока
  let mx = joystick.dx, my = joystick.dy;
  const forward = new THREE.Vector3(Math.sin(player.yaw), 0, Math.cos(player.yaw));
  const right = new THREE.Vector3(-Math.cos(player.yaw), 0, Math.sin(player.yaw));
  const move = forward.clone().multiplyScalar(-my).add(right.clone().multiplyScalar(mx));
  
  if (move.length() > 1) move.normalize();
  player.pos.addScaledVector(move, player.speed * dt);
  player.pos.x = Math.max(-140, Math.min(140, player.pos.x));
  player.pos.z = Math.max(-140, Math.min(140, player.pos.z));

  camera.position.set(player.pos.x, 1.7, player.pos.z);
  camera.lookAt(camera.position.clone().add(forward));

  // Пули
  for (let i = bullets.length-1; i >= 0; i--){
    const b = bullets[i];
    const dir = b.target.clone().sub(b.mesh.position).normalize();
    b.mesh.position.addScaledVector(dir, b.speed * dt);
    b.life -= dt;
    if (b.mesh.position.distanceTo(b.target) < 1 || b.life <= 0){
      scene.remove(b.mesh);
      bullets.splice(i,1);
    }
  }

  // Спавн
  spawnTimer += dt;
  if (spawnTimer > Math.max(0.3, 1.5 - player.kills * 0.01) && zombies.length < 50){
    spawnTimer = 0; spawnZombie();
  }

  // --- ЛОГИКА И АНИМАЦИЯ ЗОМБИ ---
  for (const z of zombies){
    const toP = player.pos.clone().sub(z.position);
    toP.y = 0;
    const dist = toP.length();
    toP.normalize();
    
    if (dist > 1.1) {
      z.position.addScaledVector(toP, z.userData.speed * dt);
      
      // Анимация ходьбы
      z.userData.walkPhase += dt * z.userData.speed * 4;
      const swing = Math.sin(z.userData.walkPhase);
      
      // Ноги сгибаются
      z.userData.parts.legL.rotation.x = swing * 0.6;
      z.userData.parts.legR.rotation.x = -swing * 0.6;
      
      // Руки вытянуты вперед и качаются
      z.userData.parts.armL.rotation.x = -1.2 + Math.sin(z.userData.walkPhase + Math.PI) * 0.2;
      z.userData.parts.armR.rotation.x = -1.2 + Math.sin(z.userData.walkPhase) * 0.2;
      
      // Голова слегка покачивается
      z.userData.parts.headGroup.rotation.z = swing * 0.1;
      z.userData.parts.headGroup.rotation.x = 0.2; // Наклон вперед
    } else {
      // Анимация атаки (рывок головой)
      z.userData.parts.headGroup.rotation.x = Math.sin(now * 0.02) * 0.3 + 0.3;
    }
    
    z.lookAt(player.pos.x, z.position.y, player.pos.z);

    if (dist < 1.3 && now - damageCooldown > 600){
      damagePlayer(10);
      damageCooldown = now;
    }
    
    // Эффект попадания
    if (now - z.userData.lastHit < 100) {
      z.traverse(c => { if(c.isMesh) c.material.emissive?.setHex(0x550000); });
    } else {
      z.traverse(c => { if(c.isMesh) c.material.emissive?.setHex(0x000000); });
    }
  }

  renderer.render(scene, camera);
}
animate();

// Запуск ресайза при полной загрузке
window.addEventListener('load', resizeGame);
</script>
